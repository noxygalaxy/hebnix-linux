[package]
name = "hebnix-app"
version = "0.1.0"
edition = "2024"

[features]
default = []
lite = []

[[bin]]
name = "hebnix-app"
path = "src/main.rs"

[[bin]]
name = "hebnix-lite"
path = "src/lite_main.rs"
required-features = ["lite"]

[dependencies]
aes = "0.8"
crossbeam-channel.workspace = true
dirs = "6.0.0"
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.35.0", features = ["image", "svg"] }
hebnix-sdk = { version = "0.1.0", path = "../hebnix-sdk" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "ico", "bmp", "webp"] }
libloading = "0.8"
bcdec_rs = "0.1"
mlua = { version = "0.11.6", features = ["lua54", "vendored", "serialize"] }
httparse = "1"
open = "5.3.6"
rand = "0.8"
rcgen = { version = "0.14", features = ["x509-parser"] }
rfd = "0.17.2"
rsa = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rust-ini = "0.21.3"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
toml = "1.1.2"
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = "0.24.1"
ureq = { workspace = true, features = ["json"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
reqwest = { version = "0.11", features = ["blocking", "multipart"] }
base64 = "0.21"
flate2 = "1.0"
hmac = "0.12"
sha2 = "0.10"
socket2 = "0.5"
hex = "0.4"
gamepads = "0.1"
rodio = "0.17"
tungstenite = { version = "0.21", features = ["native-tls"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }

# --- linux port additions ---
sysinfo = "0.38.4"
nix = { version = "0.29", features = ["process", "signal", "fs", "user", "poll"] }
libc = "0.2"
caps = "0.5"
shell-words = "1"
crc32fast = "1"
evdev = "0.13"
gilrs = "0.11"
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop"] }
wayland-client = "0.31"
# wayland-backend falls back to raw eprintln! (bypassing RUST_LOG/tracing
# entirely) unless its own `log` feature is enabled; enabling it routes
# those messages through the `log` crate instead, which we never install a
# logger for, so they're silently dropped rather than spamming stderr. Used
# to suppress a confirmed-benign, high-frequency EPROTO report from the
# overlay's layer-shell surface (harmless: overlay keeps rendering fine).
wayland-backend = { version = "0.3", features = ["log"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
tiny-skia = "0.11"
ab_glyph = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
cairo = { version = "=0.18.5", package = "cairo-rs" }
gdk = "0.18.2"
gtk = "0.18"
gtk-layer-shell = { version = "0.8.2", features = ["v0_6"] }
url = "2.5.8"
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }
javascriptcore-rs = "1.1.2"
